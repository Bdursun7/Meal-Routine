# Optional XcodeGen spec. The checked-in MealRoutine.xcodeproj already opens in Xcode.
name: MealRoutine
configs:
  Debug: debug
  Debug-Local: debug
  Release: release
packages:
  GoogleSignIn-iOS:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0
options:
  bundleIdPrefix: com.mealroutine
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: tr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "5.0.0"
    CURRENT_PROJECT_VERSION: "5"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MealRoutine:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # Explicit group, not a synchronized folder, so each Swift file is a Compile Sources member.
      - path: MealRoutine
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealroutine.app
        PRODUCT_NAME: MealRoutine
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MealRoutine
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "5.0.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_ENTITLEMENTS: MealRoutine/MealRoutine.entitlements
        INFOPLIST_FILE: MealRoutine/Info.plist
      configs:
        Debug-Local:
          CODE_SIGN_ENTITLEMENTS: MealRoutine/MealRoutine.Local.entitlements
          INFOPLIST_FILE: MealRoutine/Info-Local.plist
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG HOUSEHOLD_LOCAL
    dependencies:
      - target: MealRoutineShare
        embed: true
      - package: GoogleSignIn-iOS
        product: GoogleSignIn
  MealRoutineShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ShareExtension
      - path: MealRoutine/Features/RecipeImport/ShareHandoff.swift
      - path: MealRoutine/Services/Import/RecipeSourceService.swift
    info:
      path: ShareExtension/Info.plist
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealroutine.app.share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "5.0.0"
        CURRENT_PROJECT_VERSION: "5"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug-Local:
          CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.Local.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG HOUSEHOLD_LOCAL
  MealRoutineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MealRoutineTests
    dependencies:
      - target: MealRoutine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealroutine.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MealRoutine.app/MealRoutine"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug-Local:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG HOUSEHOLD_LOCAL
  MealRoutineUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MealRoutineUITests
    dependencies:
      - target: MealRoutine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealroutine.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: MealRoutine
schemes:
  MealRoutine Local:
    build:
      targets:
        MealRoutine: all
        MealRoutineTests: [test]
        MealRoutineUITests: [test]
    run:
      config: Debug-Local
    test:
      config: Debug-Local
      targets:
        - MealRoutineTests
        - MealRoutineUITests
    analyze:
      config: Debug-Local
    archive:
      config: Release
