# Optional XcodeGen spec. The checked-in MealRoutine.xcodeproj already opens in Xcode.
name: MealRoutine
options:
  bundleIdPrefix: com.mealroutine
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: tr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MealRoutine:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # Explicit group, not a synchronized folder, so each Swift file is a Compile Sources member.
      - path: MealRoutine
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealroutine.app
        PRODUCT_NAME: MealRoutine
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MealRoutine
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
  MealRoutineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MealRoutineTests
    dependencies:
      - target: MealRoutine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealroutine.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MealRoutine.app/MealRoutine"
        BUNDLE_LOADER: "$(TEST_HOST)"
